name: Bug report
description: Something in Foundry misbehaves
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the exact command and full output where possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Foundry version
      placeholder: foundry --version
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Environment
      description: OS, Python version, OpenTofu/Terraform version, provider.
