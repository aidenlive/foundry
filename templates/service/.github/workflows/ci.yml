name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check
        run: python3 -m compileall -q app

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: docker build -t ghcr.io/${{ github.repository_owner }}/{{ foundry.service_name }}:${{ github.sha }} .

      - name: Push image
        if: github.event_name == 'push'
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/{{ foundry.service_name }}:${{ github.sha }}
          docker tag ghcr.io/${{ github.repository_owner }}/{{ foundry.service_name }}:${{ github.sha }} \
                     ghcr.io/${{ github.repository_owner }}/{{ foundry.service_name }}:latest
          docker push ghcr.io/${{ github.repository_owner }}/{{ foundry.service_name }}:latest
