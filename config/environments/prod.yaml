apiVersion: foundry/v1
kind: Environment

metadata:
  name: prod
  displayName: Production

spec:
  tier: production

  cloud:
    region: nyc3

  network:
    cidr: "10.40.0.0/16"

  security:
    deletionProtectionDefault: true

  kubernetes:
    version: "1.31"
    nodeSize: s-4vcpu-8gb
    minNodes: 3
    maxNodes: 9
    highAvailabilityControlPlane: true

  scaling:
    haRequired: true

  observability:
    defaultRetentionDays: 90

  labels:
    environment: prod
