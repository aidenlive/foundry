# Environment configuration — highest-precedence tracked overrides.
apiVersion: foundry/v1
kind: Environment

metadata:
  name: dev
  displayName: Development

spec:
  tier: nonproduction

  cloud:
    region: nyc3

  network:
    cidr: "10.20.0.0/16"

  security:
    ssh:
      allowedCidrs: []          # use `foundry` bastion/tailnet, not open SSH
    deletionProtectionDefault: false

  kubernetes:
    version: "1.31"
    nodeSize: s-2vcpu-4gb
    minNodes: 1
    maxNodes: 3
    highAvailabilityControlPlane: false

  scaling:
    haRequired: false

  labels:
    environment: dev
