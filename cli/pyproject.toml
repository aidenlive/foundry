[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "foundry-cli"
version = "0.1.0"
description = "Foundry — a cloud-agnostic infrastructure toolkit by Standard Compute Org."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Standard Compute Org.", email = "ops@standardcompute.org" }]
keywords = ["infrastructure", "iac", "terraform", "opentofu", "platform-engineering", "devops"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "PyYAML>=6.0",
  "jsonschema>=4.20",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1.1",
  "ruff>=0.4",
  "yamllint>=1.35",
  "python-hcl2>=4.3",
  "mkdocs-material>=9.5",
]

[project.urls]
Homepage = "https://standardcompute.org"
Documentation = "https://standardcompute.github.io/foundry/"
Repository = "https://github.com/standardcompute/foundry"
Issues = "https://github.com/standardcompute/foundry/issues"

[project.scripts]
foundry = "foundry_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["SIM108"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
